<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Study AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0f1a;
    --surface: #131929;
    --surface2: #1c2540;
    --accent: #4fffb0;
    --accent2: #38bdf8;
    --text: #e8edf5;
    --muted: #6b7a9a;
    --border: rgba(255,255,255,0.07);
    --radius: 14px;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    white-space: nowrap;
  }
  .logo span { color: var(--accent2); }

  .api-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 480px;
  }

  #apiKey {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    min-width: 0;
    transition: border-color 0.2s;
  }
  #apiKey:focus { border-color: var(--accent2); }
  #apiKey::placeholder { color: var(--muted); }

  #modelSelect {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 7px 12px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* CHAT */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--surface2) transparent;
  }

  .msg {
    max-width: 780px;
    width: 100%;
    display: flex;
    gap: 12px;
    animation: fadeUp 0.25s ease;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'Syne', sans-serif;
  }
  .msg.user .avatar { background: var(--accent); color: #000; }
  .msg.assistant .avatar { background: var(--accent2); color: #000; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 0.88rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--surface2);
    border: 1px solid rgba(56,189,248,0.2);
    border-top-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  /* code blocks */
  .bubble code {
    background: rgba(0,0,0,0.4);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85em;
    color: var(--accent);
  }
  .bubble pre {
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin-top: 8px;
  }
  .bubble pre code { background: none; padding: 0; }

  /* typing indicator */
  .typing .bubble {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 18px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent2);
    animation: bounce 1.2s infinite ease;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* welcome */
  .welcome {
    text-align: center;
    margin: auto;
    padding: 40px 20px;
  }
  .welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .welcome p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; }

  /* INPUT */
  #inputArea {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  #userInput {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 180px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #userInput:focus { border-color: var(--accent2); }
  #userInput::placeholder { color: var(--muted); }

  #sendBtn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    width: 48px;
    height: 48px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    font-weight: bold;
  }
  #sendBtn:hover { background: #7fffc4; transform: scale(1.05); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* error toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #ff4d6d;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 99;
    animation: fadeUp 0.3s ease;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Study<span>AI</span></div>
  <div class="api-row">
    <input id="apiKey" type="password" placeholder="Paste your OpenAI API key (sk-...)"/>
    <select id="modelSelect">
      <option value="gpt-4o-mini">GPT-4o mini</option>
      <option value="gpt-4o">GPT-4o</option>
      <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
    </select>
  </div>
  <button class="clear-btn" onclick="clearChat()">↺ Clear</button>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <h2>StudyAI</h2>
    <p>Your personal AI tutor.<br/>Paste your OpenAI key above and start asking anything!</p>
  </div>
</div>

<div id="inputArea">
  <textarea id="userInput" placeholder="Ask anything… homework, essays, math, coding…" rows="1"></textarea>
  <button id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let messages = [];

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
  });

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Load saved key
  const savedKey = localStorage.getItem('oai_key');
  if (savedKey) document.getElementById('apiKey').value = savedKey;

  function clearChat() {
    messages = [];
    chatEl.innerHTML = `<div class="welcome" id="welcome">
      <h2>StudyAI</h2>
      <p>Your personal AI tutor.<br/>Paste your OpenAI key above and start asking anything!</p>
    </div>`;
  }

  function addMessage(role, content) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : 'AI';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatContent(content);

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function formatContent(text) {
    // simple code block and inline code formatting
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${escHtml(code.trim())}</code></pre>`
    );
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    return text;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant typing';
    msg.id = 'typing';
    msg.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    const key = document.getElementById('apiKey').value.trim();
    if (!key.startsWith('sk-')) {
      showToast('Please paste a valid OpenAI API key (starts with sk-)');
      return;
    }
    localStorage.setItem('oai_key', key);

    const model = document.getElementById('modelSelect').value;
    messages.push({ role: 'user', content: text });
    addMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({
          model,
          messages: [
            { role: 'system', content: 'You are a helpful, knowledgeable tutor. Be concise but thorough. Format code in markdown code blocks.' },
            ...messages
          ],
          max_tokens: 1500
        })
      });

      const data = await res.json();

      if (data.error) {
        removeTyping();
        showToast('OpenAI Error: ' + data.error.message);
        messages.pop();
        return;
      }

      const reply = data.choices[0].message.content;
      messages.push({ role: 'assistant', content: reply });
      removeTyping();
      addMessage('assistant', reply);

    } catch (err) {
      removeTyping();
      showToast('Network error. Check your key and connection.');
      messages.pop();
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
